<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Parquímetro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Simulador de Parquímetro</h1>
            <p class="descricao">
                Informe o valor que deseja pagar e veja o tempo de estacionamento
                e o troco, quando houver.
            </p>

            <form id="parquimetroForm">
                <label for="valor">Valor pago (R$)</label>
                <input
                    type="number"
                    id="valor"
                    name="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 2.00"
                    required
                >

                <button type="submit">Calcular</button>
            </form>

            <div id="resultado" class="resultado" aria-live="polite">
                <p>Informe um valor para começar.</p>
            </div>
        </section>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
